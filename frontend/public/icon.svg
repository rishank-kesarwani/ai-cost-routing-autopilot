<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Outer Orbit Rings -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" opacity="0.25" />

  <!-- Neural Mesh Polyline Network -->
  <g stroke="#38bdf8" stroke-width="1.6" opacity="0.55" fill="none">
    <line x1="64" y1="24" x2="98" y2="44" />
    <line x1="98" y1="44" x2="98" y2="84" />
    <line x1="98" y1="84" x2="64" y2="104" />
    <line x1="64" y1="104" x2="30" y2="84" />
    <line x1="30" y1="84" x2="30" y2="44" />
    <line x1="30" y1="44" x2="64" y2="24" />
    <line x1="64" y1="64" x2="30" y2="44" />
    <line x1="64" y1="64" x2="98" y2="84" />
    <line x1="64" y1="64" x2="64" y2="104" />
  </g>

  <!-- Nodes -->
  <circle cx="64" cy="24" r="3.5" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="98" cy="44" r="3" fill="#38bdf8" />
  <circle cx="98" cy="84" r="3.5" fill="#818cf8" />
  <circle cx="64" cy="104" r="3" fill="#6366f1" />
  <circle cx="30" cy="84" r="3.5" fill="#38bdf8" />
  <circle cx="30" cy="44" r="3" fill="#22d3ee" />

  <!-- Dynamic Autopilot Routing Vector (Arrow/Compass) -->
  <g filter="url(#glow)">
    <path
      d="M64 36 L92 78 L64 66 L36 78 Z"
      fill="url(#vectorGrad)"
      stroke="#ffffff"
      stroke-width="1"
      stroke-linejoin="round"
    />
    <path
      d="M64 36 L64 66 L92 78 Z"
      fill="#ffffff"
      opacity="0.22"
    />
  </g>

  <!-- Glowing Pulse Core -->
  <circle cx="64" cy="65" r="4" fill="#ffffff" filter="url(#glow)" />
  <circle cx="64" cy="65" r="2" fill="#22d3ee" />
</svg>
